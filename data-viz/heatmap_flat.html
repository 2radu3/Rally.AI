<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Court Heatmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080b10;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px 16px;
      font-family: 'Space Mono', monospace;
    }

    /* ── Canvas sits flat, no perspective or rotation ── */
    #court-canvas {
      display: block;
    }

    /* ── Legend ── */
    #legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 140px;
    }

    #legend-labels {
      display: flex;
      justify-content: space-between;
    }

    #legend-labels span {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4a5068;
    }

    #legend-bar {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg,
        #08141e 0%, #0a3450 18%, #0a6455 36%,
        #14af73 52%, #c3da32 68%, #f59b0a 82%, #ef3c3c 100%
      );
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
      background: #0e1420;
      border: 1px solid rgba(0, 229, 180, 0.28);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 130px;
    }
    #tooltip.show { opacity: 1; }
    #tt-zone { font-size: 11px; font-weight: 700; color: #e8eaf0; margin-bottom: 5px; }
    #tt-bar-wrap { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-bottom: 6px; overflow: hidden; }
    #tt-bar { height: 100%; border-radius: 2px; }
    #tt-pct { font-size: 10px; color: #4a5068; }
  </style>
</head>
<body>

  <canvas id="court-canvas"></canvas>

  <div id="legend">
    <div id="legend-labels">
      <span>Low</span><span>Med</span><span>High</span>
    </div>
    <div id="legend-bar"></div>
  </div>

  <div id="tooltip">
    <div id="tt-zone"></div>
    <div id="tt-bar-wrap"><div id="tt-bar"></div></div>
    <div id="tt-pct"></div>
  </div>

<script>
// --- 1. DIMENSIONS ---
const COLS = 26;
const ROWS = 40;
const CELL = 10;
const GAP  = 0.8;

const CW = COLS * CELL;
const CH = ROWS * CELL;

window.heat = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

// --- 2. COLOR RAMP ---
const COLOR_STOPS = [
  { t: 0,    r: 8,   g: 20,  b: 38  },
  { t: 0.15, r: 8,   g: 52,  b: 80  },
  { t: 0.32, r: 10,  g: 100, b: 85  },
  { t: 0.50, r: 20,  g: 175, b: 115 },
  { t: 0.67, r: 195, g: 218, b: 50  },
  { t: 0.82, r: 245, g: 155, b: 10  },
  { t: 1,    r: 239, g: 60,  b: 60  },
];

function lerpColor(v) {
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (v >= COLOR_STOPS[i].t && v <= COLOR_STOPS[i + 1].t) {
      lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break;
    }
  }
  const t = lo.t === hi.t ? 0 : (v - lo.t) / (hi.t - lo.t);
  return [
    Math.round(lo.r + (hi.r - lo.r) * t),
    Math.round(lo.g + (hi.g - lo.g) * t),
    Math.round(lo.b + (hi.b - lo.b) * t),
  ];
}

// --- 3. DATA PROCESSING ---
function processCoordinatesToHeatmap(points) {
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  points.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });

  const rangeX = maxX - minX || 1;
  const rangeY = maxY - minY || 1;

  points.forEach(p => {
    const col = Math.min(COLS - 1, Math.floor(((p.x - minX) / rangeX) * COLS));
    const row = Math.min(ROWS - 1, Math.floor(((p.y - minY) / rangeY) * ROWS));
    const weight = (p.duration || 0.03) * 5.0;

    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          const falloff = (dr === 0 && dc === 0) ? 1.0 : 0.3;
          grid[nr][nc] += weight * falloff;
        }
      }
    }
  });

  let maxHeat = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] > maxHeat) maxHeat = grid[r][c];

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      grid[r][c] = maxHeat > 0 ? Math.min(1, grid[r][c] / (maxHeat * 0.8)) : 0;

  return grid;
}

async function loadAnalyzerData() {
  try {
    const response = await fetch('web_input.txt');
    if (!response.ok) throw new Error('File not found');
    let text = await response.text();
    text = text.replace(/const\s+rawMatchData\s*=\s*/, '');
    text = text.replace(/;\s*$/, '');
    text = text.replace(/np\.float32\((.*?)\)/g, '$1');
    text = text.replace(/'/g, '"');
    const rawMatchData = JSON.parse(text);
    console.log(`✅ Loaded ${rawMatchData.length} points`);
    window.heat = processCoordinatesToHeatmap(rawMatchData);
    render();
  } catch (e) {
    console.error('❌ Failed to load web_input.txt:', e);
  }
}

// --- 4. CANVAS ---
const canvas = document.getElementById('court-canvas');
canvas.width  = CW;
canvas.height = CH;
const ctx = canvas.getContext('2d');

// --- 5. DRAW ---
function render() {
  ctx.clearRect(0, 0, CW, CH);

  // ── Heat cells ──
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = window.heat[r][c];
      if (v < 0.01) continue;
      const [R, G, B] = lerpColor(v);
      ctx.fillStyle = `rgba(${R},${G},${B},${0.3 + v * 0.7})`;
      ctx.fillRect(c * CELL + GAP, r * CELL + GAP, CELL - GAP * 2, CELL - GAP * 2);
    }
  }

  // ── Court surface (drawn on top of heat with low alpha so heat shows through) ──
  ctx.fillStyle = 'rgba(0, 90, 70, 0.04)';
  ctx.fillRect(0, 0, CW, CH);

  // ── Court border ──
  ctx.strokeStyle = 'rgba(0,229,180,0.55)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, CW, CH);

  // ── Hairline grid ──
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(CW, r * CELL); ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, CH); ctx.stroke();
  }

  // ── Net ──
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, CH / 2); ctx.lineTo(CW, CH / 2); ctx.stroke();

  // ── Centre vertical ──
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH); ctx.stroke();

  // ── Service lines ──
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, CH * 0.28); ctx.lineTo(CW, CH * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, CH * 0.72); ctx.lineTo(CW, CH * 0.72); ctx.stroke();
  ctx.setLineDash([]);
}

// --- 6. TOOLTIP ---
const tooltip = document.getElementById('tooltip');
const ttZone  = document.getElementById('tt-zone');
const ttBar   = document.getElementById('tt-bar');
const ttPct   = document.getElementById('tt-pct');

const ROW_NAMES = ['Back Wall','Back Wall','Back','Back','Back','Mid','Mid','Mid','Mid','Mid','Mid','Mid','Mid','Mid','Front','Front','Front','Front','Front','Front','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net','Net'];
const colZone = c => c < COLS / 3 ? 'Left' : c < (COLS * 2 / 3) ? 'Centre' : 'Right';

canvas.addEventListener('mousemove', e => {
  const col = Math.floor(e.offsetX / CELL);
  const row = Math.floor(e.offsetY / CELL);
  if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
    const v = window.heat[row][col];
    if (v === 0) { tooltip.classList.remove('show'); return; }
    const [R, G, B] = lerpColor(v);
    ttZone.textContent     = (ROW_NAMES[row] || 'Zone') + ' · ' + colZone(col);
    ttBar.style.width      = (v * 100) + '%';
    ttBar.style.background = `rgb(${R},${G},${B})`;
    ttPct.textContent      = 'Activity: ' + Math.round(v * 100) + '%';
    tooltip.classList.add('show');
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 160) + 'px';
    tooltip.style.top  = Math.max(e.clientY - 60, 8) + 'px';
  } else {
    tooltip.classList.remove('show');
  }
});
canvas.addEventListener('mouseleave', () => tooltip.classList.remove('show'));

// --- START ---
render();
loadAnalyzerData();
</script>
</body>
</html>
