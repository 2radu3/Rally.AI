<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Court Heatmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────
       RESET & PAGE
    ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080b10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 16px;
      font-family: 'Space Mono', monospace;
    }

    /* ─────────────────────────────────────────────
       ISOMETRIC SCENE
    ───────────────────────────────────────────── */
    #scene {
      perspective: 1200px;
      perspective-origin: 50% 25%;
    }

    #iso {
      transform: rotateX(52deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      position: relative;
    }

    #court-canvas {
      display: block;
      position: relative;
    }

    /* ─────────────────────────────────────────────
       3D ELEMENTS (Walls & Bars)
    ───────────────────────────────────────────── */
    .wall {
      position: absolute;
      background: rgba(0, 229, 180, 0.05);
      border: 1px solid rgba(0, 229, 180, 0.35);
      pointer-events: none;
    }

    .bar-group {
      position: absolute;
      transform-style: preserve-3d;
      pointer-events: none; /* Let hover pass through to the canvas */
    }

    .bar-face { position: absolute; }

    /* ─────────────────────────────────────────────
       LEGEND BAR
    ───────────────────────────────────────────── */
    #legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 260px;
    }

    #legend-labels {
      display: flex;
      justify-content: space-between;
    }

    #legend-labels span {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4a5068;
    }

    #legend-bar {
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(90deg,
        #08141e 0%, #0a3450 18%, #0a6455 36%,
        #14af73 52%, #c3da32 68%, #f59b0a 82%, #ef3c3c 100%
      );
    }

    /* ─────────────────────────────────────────────
       TOOLTIP
    ───────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
      background: #0e1420;
      border: 1px solid rgba(0, 229, 180, 0.28);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 130px;
    }
    #tooltip.show { opacity: 1; }
    #tt-zone { font-size: 11px; font-weight: 700; color: #e8eaf0; margin-bottom: 5px; }
    #tt-bar-wrap { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-bottom: 6px; overflow: hidden; }
    #tt-bar { height: 100%; border-radius: 2px; }
    #tt-pct { font-size: 10px; color: #4a5068; }
  </style>
</head>
<body>

  <div id="scene">
    <div id="iso">
      <canvas id="court-canvas"></canvas>
      </div>
  </div>

  <div id="legend">
    <div id="legend-labels">
      <span>Low</span><span>Medium</span><span>High</span>
    </div>
    <div id="legend-bar"></div>
  </div>

  <div id="tooltip">
    <div id="tt-zone"></div>
    <div id="tt-bar-wrap"><div id="tt-bar"></div></div>
    <div id="tt-pct"></div>
  </div>

<script>
// --- 1. DIMENSIONS ---
const COLS   = 18;
const ROWS   = 26;
const CELL   = 10;
const MAX_H  = 70;
const WALL_H = 30;
const GAP    = 1;

const CW = COLS * CELL;
const CH = ROWS * CELL;

// --- 2. COLOR RAMP ---
const COLOR_STOPS = [
  { t: 0,    r: 8,   g: 20,  b: 38  },
  { t: 0.15, r: 8,   g: 52,  b: 80  },
  { t: 0.32, r: 10,  g: 100, b: 85  },
  { t: 0.50, r: 20,  g: 175, b: 115 },
  { t: 0.67, r: 195, g: 218, b: 50  },
  { t: 0.82, r: 245, g: 155, b: 10  },
  { t: 1,    r: 239, g: 60,  b: 60  },
];

function lerpColor(v) {
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (v >= COLOR_STOPS[i].t && v <= COLOR_STOPS[i + 1].t) {
      lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break;
    }
  }
  const t = lo.t === hi.t ? 0 : (v - lo.t) / (hi.t - lo.t);
  return [
    Math.round(lo.r + (hi.r - lo.r) * t),
    Math.round(lo.g + (hi.g - lo.g) * t),
    Math.round(lo.b + (hi.b - lo.b) * t),
  ];
}
function darker([r, g, b], f) { return [Math.round(r * f), Math.round(g * f), Math.round(b * f)]; }
function toCSS([r, g, b], a = 1) { return a < 1 ? `rgba(${r},${g},${b},${a})` : `rgb(${r},${g},${b})`; }

// --- 3. DATA ---
// --- 3. DATA: COORDINATE PROCESSOR ---

/**
 * Converts a list of raw coordinates into a 2D Heatmap Grid.
 * @param {Array} points - List of {x, y} objects. 
 * Assumes x is [0 to COLS] and y is [0 to ROWS].
 */
function processCoordinatesToHeatmap(points) {
  // 1. Initialize an empty grid (all zeros)
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

  points.forEach(p => {
    const col = Math.floor(p.x);
    const row = Math.floor(p.y);

    // 2. Add "Heat" to the specific cell and its neighbors for a smooth look
    // This creates a 3x3 "glow" around the point
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = row + dr;
        const nc = col + dc;

        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          // Points closer to the center get more heat
          const intensity = (dr === 0 && dc === 0) ? 0.4 : 0.15;
          grid[nr][nc] += intensity;
        }
      }
    }
  });

  // 3. Normalize: Ensure no cell exceeds 1.0 (100% activity)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = Math.min(1, grid[r][c]);
    }
  }

  return grid;
}

// --- EXAMPLE USAGE ---
// This is where your video analyzer would plug in its results:
const rawMatchData = [
  { x: 2,  y: 2 }, { x: 2,  y: 3 },  // Back Left corner
  { x: 15, y: 24 }, { x: 16, y: 25 }, // Front Right (Net)
  { x: 9,  y: 13 }, { x: 9,  y: 12 }, // Middle / T-Zone
  { x: 2,  y: 22 }, { x: 3,  y: 21 }, // Front Left
];

// Generate the heatmap from the list
const heat = processCoordinatesToHeatmap(rawMatchData);

// --- 4. CANVAS (Floor Only) ---
const canvas = document.getElementById('court-canvas');
canvas.width  = CW;
canvas.height = CH;
canvas.style.width  = CW + 'px';
canvas.style.height = CH + 'px';
const ctx = canvas.getContext('2d');

function drawFloorAndMarkings() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(0, 90, 70, 0.12)';
  ctx.fillRect(0, 0, CW, CH);
  ctx.strokeStyle = 'rgba(0,229,180,0.50)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, CW, CH);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(CW, r * CELL); ctx.stroke(); }
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, CH); ctx.stroke(); }

  // Markings
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, CH / 2); ctx.lineTo(CW, CH / 2); ctx.stroke(); // Net
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH); ctx.stroke(); // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, CH * 0.28); ctx.lineTo(CW, CH * 0.28); ctx.stroke(); // Service lines
  ctx.beginPath(); ctx.moveTo(0, CH * 0.72); ctx.lineTo(CW, CH * 0.72); ctx.stroke();
  ctx.setLineDash([]);
}

// --- 5. 3D CSS BUILDER ---
function buildScene() {
  const iso = document.getElementById('iso');

  // Build Bars
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = heat[r][c];
      if (v < 0.02) continue;

      const h = Math.max(1, v * MAX_H);
      const col = lerpColor(v);
      const bw = CELL - GAP * 2;

      // The bar container, sitting flat on the cell coordinate
      const group = document.createElement('div');
      group.className = 'bar-group';
      group.style.left = (c * CELL + GAP) + 'px';
      group.style.top  = (r * CELL + GAP) + 'px';
      group.style.width  = bw + 'px';
      group.style.height = bw + 'px';

      // Top Cap (pushed up into the Z axis)
      const topFace = document.createElement('div');
      topFace.className = 'bar-face';
      topFace.style.width = '100%'; topFace.style.height = '100%';
      topFace.style.background = toCSS(col);
      topFace.style.transform = `translateZ(${h}px)`;
      topFace.style.border = '1px solid rgba(255,255,255,0.1)';

      // Front Face (hinged at the top edge of the cell, dropping down to floor)
      const frontFace = document.createElement('div');
      frontFace.className = 'bar-face';
      frontFace.style.left = '0'; frontFace.style.top = bw + 'px';
      frontFace.style.width = bw + 'px'; frontFace.style.height = h + 'px';
      frontFace.style.transformOrigin = 'top';
      frontFace.style.transform = 'rotateX(90deg)';
      frontFace.style.background = toCSS(darker(col, 0.6));

      // Right Face (hinged at the left edge of its starting point, dropping to floor)
      const rightFace = document.createElement('div');
      rightFace.className = 'bar-face';
      rightFace.style.left = bw + 'px'; rightFace.style.top = '0';
      rightFace.style.width = h + 'px'; rightFace.style.height = bw + 'px';
      rightFace.style.transformOrigin = 'left';
      rightFace.style.transform = 'rotateY(-90deg)';
      rightFace.style.background = toCSS(darker(col, 0.4));

      group.appendChild(topFace);
      group.appendChild(frontFace);
      group.appendChild(rightFace);
      iso.appendChild(group);
    }
  }

  // Build Walls (Appended after bars so glass transparency draws over them nicely)
  function makeWall(styles) {
    const w = document.createElement('div');
    w.className = 'wall';
    Object.assign(w.style, styles);
    iso.appendChild(w);
  }

  // Back wall
  makeWall({
    left: '0px', top: '0px', width: CW + 'px', height: WALL_H + 'px',
    transformOrigin: 'top center', transform: 'rotateX(90deg)'
  });
  // Front wall
  makeWall({
    left: '0px', top: (CH - WALL_H) + 'px', width: CW + 'px', height: WALL_H + 'px',
    transformOrigin: 'bottom center', transform: 'rotateX(-90deg)'
  });
  // Left wall
  makeWall({
    left: '0px', top: '0px', width: WALL_H + 'px', height: CH + 'px',
    transformOrigin: 'left center', transform: 'rotateY(-90deg)'
  });
  // Right wall
  makeWall({
    left: (CW - WALL_H) + 'px', top: '0px', width: WALL_H + 'px', height: CH + 'px',
    transformOrigin: 'right center', transform: 'rotateY(90deg)'
  });
}

// --- 6. TOOLTIP ---
const tooltip = document.getElementById('tooltip');
const ttZone  = document.getElementById('tt-zone');
const ttBar   = document.getElementById('tt-bar');
const ttPct   = document.getElementById('tt-pct');

const ROW_NAMES = [
  'Back Wall','Back Wall', 'Back','Back','Back',
  'Mid','Mid','Mid','Mid','Mid','Mid','Mid','Mid','Mid',
  'Front','Front','Front','Front','Front','Front',
  'Net','Net','Net','Net','Net','Net',
];
const colZone = c => c < COLS / 3 ? 'Left' : c < (COLS * 2 / 3) ? 'Centre' : 'Right';

canvas.addEventListener('mousemove', e => {
  // e.offsetX/Y automatically un-projects the 3D mouse position perfectly
  const col = Math.floor(e.offsetX / CELL);
  const row = Math.floor(e.offsetY / CELL);

  if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
    const v = heat[row][col];
    const [R, G, B] = lerpColor(v);

    ttZone.textContent     = (ROW_NAMES[Math.min(row, ROW_NAMES.length - 1)] || 'Zone') + ' · ' + colZone(col);
    ttBar.style.width      = (v * 100) + '%';
    ttBar.style.background = `rgb(${R},${G},${B})`;
    ttPct.textContent      = 'Activity: ' + Math.round(v * 100) + '%';

    tooltip.classList.add('show');
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 160) + 'px';
    tooltip.style.top  = Math.max(e.clientY - 60, 8) + 'px';
  } else {
    tooltip.classList.remove('show');
  }
});
canvas.addEventListener('mouseleave', () => tooltip.classList.remove('show'));

// --- INIT ---
drawFloorAndMarkings();
buildScene();
</script>
</body>
</html>
